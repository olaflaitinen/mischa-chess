name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bench
        shell: bash
        run: |
          exe=build/mischa
          [ -f build/Release/mischa.exe ] && exe=build/Release/mischa.exe
          (echo "bench 8"; sleep 30; echo quit) | "$exe" | tail -n 1

  makefile:
    name: make (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test

  suite:
    name: test suite (perft, robustness, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q stockfish
          pip install chess pyflakes

      - name: Lint Python
        run: python -m pyflakes testing tests tools

      - name: Build
        run: |
          make popcnt
          make popcnt EXE=mischa-asan CXXFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" LDFLAGS="-fsanitize=address,undefined"

      - name: Perft and robustness
        run: |
          python testing/run_suite.py --mischa ./mischa --mischa-asan ./mischa-asan \
            --stockfish /usr/games/stockfish --profile quick \
            --stages perft,robustness,report --out suite-results
          cat suite-results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, sys
          s = json.load(open("suite-results/summary.json"))
          bad = {k: v for k, v in s["robustness"].items() if k != "commands" and v}
          if not s["perft_ok"] or bad:
              sys.exit("test suite failed: perft_ok=%s %s" % (s["perft_ok"], bad))
          print("perft ok, %d robustness commands clean" % s["robustness"]["commands"])
          PY
