name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bench
        shell: bash
        run: |
          exe=build/mischa
          [ -f build/Release/mischa.exe ] && exe=build/Release/mischa.exe
          (echo "bench 8"; sleep 30; echo quit) | "$exe" | tail -n 1

  makefile:
    name: make (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make test
