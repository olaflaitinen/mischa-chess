name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and publish, for example v1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86-64,        os: ubuntu-latest,  popcnt: "OFF" }
          - { name: linux-x86-64-popcnt, os: ubuntu-latest,  popcnt: "ON"  }
          - { name: windows-x86-64,        os: windows-latest, popcnt: "OFF" }
          - { name: windows-x86-64-popcnt, os: windows-latest, popcnt: "ON"  }
          - { name: macos-arm64,         os: macos-latest,   popcnt: "OFF" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMISCHA_POPCNT=${{ matrix.popcnt }}
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          dir=mischa-${{ matrix.name }}
          mkdir -p "$dir"
          if [ -f build/Release/mischa.exe ]; then
            cp build/Release/mischa.exe "$dir/mischa.exe"
          else
            cp build/mischa "$dir/mischa"
          fi
          cp -r books LICENSE README.md AUTHORS CHANGELOG.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            zip -qr "$dir.zip" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mischa-${{ matrix.name }}
          path: mischa-${{ matrix.name }}.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Mischa ${TAG#v}" \
              --notes-file CHANGELOG.md
          fi
